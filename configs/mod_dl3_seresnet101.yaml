# Modified Deeplabv3+ with SE-ResNet101 backbone, pretrained on ImageNet.
# Atrous rates: 6, 12, 18. Output stride: 8.

experiment_name: mod_dl3_seresnet101
seed: 42
precision: 16
platform: colab

model:
  name: mod_dlab
  encoder: se_resnet101
  pretrained: true
  atrous_rates: [6, 12, 18]
  output_stride: 8

data:
  dataset: reproduction
  patch_size: 224
  train_batch_size: 64
  val_batch_size: 128
  train_transform:
    resize: true
    hflip: 0.5
    vflip: 0.5
    rotate90: 0.5
    brightness_contrast: 0.3
    gauss_noise: 0.2
  val_transform:
    resize: true
  shuffle: true

training:
  epochs: 250
  encoder_lr: 1e-4
  decoder_lr: 1e-4
  progress_bar: false

early_stopping:
  monitor: val_iou
  patience: 30
  mode: max

optimizer:
  name: radam
  params:
    weight_decay: 0.0001

scheduler:
  name: reduce_on_plateau
  params:
    factor: 0.5
    patience: 10
    mode: max
    min_lr: 1e-6
  monitor: val_iou

loss:
  name: bce_dice

logging:
  project: ArielBS
